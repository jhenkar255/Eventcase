services:
  - type: web
    name: eventease-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd eventease/server && npm install && npm run build
    startCommand: cd eventease/server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://eventease-app-936.netlify.app
